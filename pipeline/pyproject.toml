[project]
name = "word-content-pipeline"
version = "0.1.0"
description = "Local word/category content database for word association puzzles"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# wordfreq даёт частотность слов (familiarity_score, фильтр --min-zipf).
# Без него пайплайн работает, но частотность не считается.
freq = ["wordfreq>=3.0"]
dev = ["pytest>=8.0", "wordfreq>=3.0"]

[project.scripts]
word-content = "word_content.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
word_content = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
