<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Bubble Gem</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  /* ===== РАМКА-ТЕЛЕФОН 9:16 ===== */
  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:#0a4a7e;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){ #phone{height:96dvh;aspect-ratio:9/16;width:auto;
         border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;} }

  /* ===== подводный фон ===== */
  #bg{position:absolute;inset:0;z-index:0;overflow:hidden;
      background:linear-gradient(180deg,#7fd8ec 0%,#2b9fd0 16%,#1479b4 40%,#0b5490 68%,#073a63 100%);}
  .ray{position:absolute;top:-12%;width:14%;height:70%;transform:rotate(14deg);
       background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 80%);
       filter:blur(6px);border-radius:50%;}
  .amb{position:absolute;bottom:-30px;border-radius:50%;
       border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
       animation:rise linear infinite;}
  @keyframes rise{to{transform:translateY(-115vh);}}
  .coral{position:absolute;bottom:-6px;font-size:42px;opacity:.55;filter:saturate(.8);}

  /* ===== HUD ===== */
  #hud{width:100%;padding:12px 14px 4px;z-index:5;display:flex;align-items:flex-start;gap:10px;}
  #movesWrap{position:relative;width:78px;height:78px;flex:0 0 auto;}
  #movesWrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
  #movesTxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
  #movesNum{font-size:26px;font-weight:800;line-height:1;}
  #movesLbl{font-size:10px;font-weight:800;letter-spacing:.5px;}
  #hudMid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;}
  #lvl{color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.4);letter-spacing:1px;}
  #pill{width:82%;max-width:220px;height:24px;background:#1b2340;border-radius:13px;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3);}
  #pillFill{position:absolute;left:3px;top:3px;bottom:3px;width:0;min-width:18px;border-radius:10px;
            background:linear-gradient(180deg,#ffb340,#f5820b);transition:width .4s;}
  #pillTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}
  #gear{flex:0 0 auto;width:40px;height:40px;margin-top:14px;border:none;border-radius:50%;font-size:26px;
        background:transparent;color:#fff;cursor:pointer;text-shadow:0 2px 5px rgba(0,0,0,.4);}

  /* ===== поле ===== */
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;
         width:390px;height:600px;}
  .bub{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
       color:#fff;font-weight:800;text-align:center;cursor:grab;touch-action:none;
       text-shadow:0 1px 3px rgba(0,0,0,.45);
       box-shadow:inset -6px -10px 18px rgba(0,20,80,.25), inset 4px 8px 14px rgba(255,255,255,.28), 0 6px 14px rgba(0,20,60,.25);}
  .bub::before{content:'';position:absolute;left:16%;top:9%;width:34%;height:20%;border-radius:50%;
       background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-24deg);}
  .t1{background:radial-gradient(circle at 35% 30%,rgba(120,160,255,.95),rgba(62,98,208,.92) 70%,rgba(40,70,170,.95));}
  .t2{background:radial-gradient(circle at 35% 30%,rgba(140,220,110,.96),rgba(72,178,66,.93) 70%,rgba(45,130,45,.95));}
  .t3{background:radial-gradient(circle at 35% 30%,rgba(205,140,245,.96),rgba(154,84,208,.94) 70%,rgba(110,50,165,.96));}
  .t4{background:radial-gradient(circle at 35% 30%,rgba(255,190,110,.97),rgba(235,150,55,.94) 70%,rgba(200,110,30,.96));}
  .bub .ln{line-height:1.22;pointer-events:none;white-space:nowrap;}
  .bub .val{margin-top:2px;font-size:11px;font-weight:800;color:#ffe9a8;pointer-events:none;
            background:rgba(0,0,0,.22);padding:1px 7px;border-radius:8px;}
  .bub.lift{cursor:grabbing;filter:brightness(1.12);z-index:60!important;}
  .bub.hintGlow{animation:hintP .55s ease-in-out infinite alternate;}
  @keyframes hintP{from{box-shadow:0 0 0 3px #ffd94a,0 0 18px 6px rgba(255,217,74,.75);}
                   to{box-shadow:0 0 0 5px #ffd94a,0 0 30px 12px rgba(255,217,74,.95);}}
  .bub.popping{transition:transform .3s,opacity .3s;transform:scale(1.45)!important;opacity:0;}
  .bub.merged{animation:mpulse .28s ease-out;}
  @keyframes mpulse{0%{filter:brightness(1.35);}50%{filter:brightness(1.15);}100%{filter:none;}}
  .part{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:70;
        border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.25);
        transition:transform .7s ease-out,opacity .7s;}

  /* ===== драг: путь читается подсветкой, а не линией ===== */
  /* Пузырь тащат, и по дороге загораются шары, над которыми он прошёл: игрок
     видит условную траекторию и понимает, на каком шаре будет остановка.
     Обведённый белым — точка остановки. Порядок правил важен: .tgt объявлен
     после .pass, поэтому цель перебивает след. */
  .bub.pass{box-shadow:0 0 0 3px rgba(130,225,255,.7),0 0 20px 7px rgba(130,225,255,.45)!important;}
  .bub.tgt{box-shadow:0 0 0 4px #fff,0 0 28px 11px rgba(130,225,255,.8)!important;}
  .bub.err{box-shadow:0 0 0 4px #ff5148,0 0 26px 9px rgba(255,81,72,.75)!important;animation:shk .34s;}
  .bub.blk{box-shadow:0 0 0 4px #e8f7ff,0 0 24px 8px rgba(205,240,255,.8)!important;animation:shk .34s;}
  @keyframes shk{0%,100%{margin-left:0;}25%{margin-left:-5px;}75%{margin-left:5px;}}
  /* покинутое место: видно, что досыпка его не занимает, пока шар в руке */
  #ghost{position:absolute;border-radius:50%;border:3px dashed rgba(255,255,255,.45);
         pointer-events:none;z-index:3;display:none;}

  /* ===== модификаторы (GDD §7) ===== */
  .bub.half{border:3px dashed rgba(255,255,255,.85);
    background:radial-gradient(circle at 35% 30%,rgba(155,235,255,.97),rgba(70,180,225,.94) 70%,rgba(38,128,175,.96));}
  .bub.ice{cursor:not-allowed;filter:saturate(.45) brightness(1.22);
    box-shadow:inset 0 0 0 5px rgba(255,255,255,.82),0 0 18px rgba(205,245,255,.8);}
  .bub.hid{cursor:not-allowed;
    background:radial-gradient(circle at 35% 30%,rgba(168,168,208,.96),rgba(98,98,150,.94) 70%,rgba(62,62,112,.96));}
  .bub .cnt{margin-top:2px;font-size:11px;font-weight:800;color:#fff;pointer-events:none;
            background:rgba(0,0,0,.34);padding:1px 7px;border-radius:8px;}
  #chain{position:absolute;left:0;right:0;height:14px;margin-top:-7px;z-index:55;
    background:repeating-linear-gradient(90deg,#d3dae4 0 10px,#69727e 10px 18px);
    border-top:2px solid rgba(255,255,255,.55);border-bottom:2px solid rgba(0,0,0,.4);
    box-shadow:0 4px 12px rgba(0,0,0,.5);transition:opacity .35s;}
  #chain .cn{position:absolute;right:10px;top:-13px;background:#12213a;color:#fff;
    font-size:11px;font-weight:800;border-radius:12px;padding:2px 9px;
    border:2px solid #d3dae4;white-space:nowrap;}
  #chain.hit{animation:shk .34s;
    background:repeating-linear-gradient(90deg,#ff5148 0 10px,#8e2b22 10px 18px);}

  /* ===== бустеры ===== */
  #boosters{width:100%;display:flex;justify-content:center;gap:18px;padding:6px 0 16px;z-index:5;}
  .boost{position:relative;width:64px;height:64px;border:none;border-radius:18px;cursor:pointer;font-size:30px;
         background:linear-gradient(180deg,#d8f4fb,#a8dcee);box-shadow:0 4px 10px rgba(0,20,60,.35),inset 0 -3px 6px rgba(60,140,180,.35);}
  .boost:active{transform:scale(.93);}
  .boost.off{filter:grayscale(1) brightness(.75);}
  .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:#35c24d;
         color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
         box-shadow:0 2px 4px rgba(0,0,0,.3);padding:0 5px;}

  /* ===== тост / попапы ===== */
  #toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);z-index:30;pointer-events:none;
         font-size:44px;font-weight:900;font-style:italic;color:#fff;opacity:0;white-space:nowrap;
         text-shadow:0 0 18px rgba(80,200,255,.9),0 3px 6px rgba(0,0,0,.5);}
  #toast.show{animation:tpop 1.1s ease-out;}
  @keyframes tpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    30%{transform:translate(-50%,-50%) scale(1);}
    75%{opacity:1;}100%{opacity:0;transform:translate(-50%,-62%) scale(1);}}
  #ov{position:absolute;inset:0;z-index:40;background:rgba(4,20,40,.62);display:none;
      align-items:center;justify-content:center;}
  #ov.show{display:flex;}
  #card{background:linear-gradient(180deg,#fdfeff,#dceefb);border-radius:22px;padding:26px 30px;text-align:center;
        width:78%;max-width:300px;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:cardIn .35s ease-out;}
  @keyframes cardIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  #cardTtl{font-size:24px;font-weight:900;color:#15406b;margin-bottom:8px;}
  #cardMsg{font-size:14px;color:#3a6083;margin-bottom:18px;font-weight:600;}
  #cardBtn{border:none;border-radius:14px;padding:12px 34px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;
        background:linear-gradient(180deg,#4fc463,#2d9e41);box-shadow:0 4px 0 #1f7530;}
  #cardBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f7530;}
  .conf{position:absolute;width:9px;height:14px;z-index:45;pointer-events:none;
        transition:transform 1.1s ease-in,opacity 1.1s;}
</style>
</head>
<body>
<div id="phone">
  <div id="bg"></div>

  <div id="hud">
    <div id="movesWrap">
      <svg viewBox="0 0 78 78">
        <circle cx="39" cy="39" r="35" fill="#1b2340" stroke="#0e1327" stroke-width="7"/>
        <circle id="ring" cx="39" cy="39" r="35" fill="none" stroke="url(#rg)" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="219.9" stroke-dashoffset="0"/>
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#8a4dff"/>
        </linearGradient></defs>
      </svg>
      <div id="movesTxt"><div id="movesNum">42</div><div id="movesLbl">MOVES</div></div>
    </div>
    <div id="hudMid">
      <div id="lvl">LVL 1</div>
      <div id="pill"><div id="pillFill"></div><div id="pillTxt">0/12</div></div>
    </div>
    <button id="gear">⚙️</button>
  </div>

  <div id="stage"><div id="board">
    <div id="ghost"></div>
    <div id="chain" hidden><span class="cn">0/2</span></div>
  </div></div>

  <div id="boosters">
    <button class="boost" id="bPlus">➕<div class="badge" id="nPlus">2</div></button>
    <button class="boost" id="bHint">🔍<div class="badge" id="nHint">2</div></button>
    <button class="boost" id="bMag">🧲<div class="badge" id="nMag">2</div></button>
  </div>

  <div id="toast"></div>
  <div id="ov"><div id="card">
    <div id="cardTtl"></div><div id="cardMsg"></div>
    <button id="cardBtn">Заново</button>
  </div></div>
</div>

<script>
/* ===== масштаб поля под рамку ===== */
function fit(){
  const stage=document.getElementById('stage'), board=document.getElementById('board');
  if(!board.offsetWidth) return;
  const sw=stage.clientWidth-8, sh=stage.clientHeight-8;
  const s=Math.max(.4, Math.min(sw/board.offsetWidth, sh/board.offsetHeight, 1.5));
  board.style.transform=`translate(-50%,-50%) scale(${s})`;
  boardScale=s;
}
window.addEventListener('resize',fit);
let boardScale=1;

/* ===== декорации фона ===== */
(function(){
  const bg=document.getElementById('bg');
  [[8,'8%'],[16,'26%'],[10,'55%'],[14,'72%']].forEach(([w,l])=>{
    const r=document.createElement('div');r.className='ray';r.style.left=l;r.style.width=w+'%';bg.appendChild(r);
  });
  for(let i=0;i<10;i++){
    const b=document.createElement('div');b.className='amb';
    const s=4+((i*7)%12);b.style.width=b.style.height=s+'px';
    b.style.left=(5+i*9.5)+'%';
    b.style.animationDuration=(9+(i*3)%8)+'s';b.style.animationDelay=(-i*1.7)+'s';
    bg.appendChild(b);
  }
  ['🪸','🌿','🪸','🌿','🪸'].forEach((e,i)=>{
    const c=document.createElement('div');c.className='coral';c.textContent=e;
    c.style.left=(3+i*21)+'%';c.style.fontSize=(30+(i*11)%22)+'px';bg.appendChild(c);
  });
})();

/* ===== контент: задачи математического солитёра =====
   категория = одинаковый результат выражения (×, −, +, /, √, ²) */
/* КАЖДАЯ категория = ровно 4 слова, шар лопается ТОЛЬКО на 4 (как в референсе).
   На старте на поле лежат части первых 7 категорий: 4-3-3-3-2-2-2 слов (19 пузырей);
   недостающие слова + 5 целых категорий = ОБЩАЯ ПЕРЕМЕШАННАЯ очередь. Поле постоянно
   пополняется СЛУЧАЙНЫМИ словами до 19 пузырей (иначе возможен тупик: одни шары без пар).
   Контент = декки Word Solitaire (Solitaire Balance.xlsx → лист Decks text). */
const DEFAULT_TARGETS=[
 {v:'SEASONS',   ex:['SPRING','AUTUMN','SUMMER','WINTER']},
 {v:'SPACE',     ex:['STAR','ROCKET','PLANET','MOON']},
 {v:'FOOD',      ex:['PIZZA','SOUP','POTATO','PASTA']},
 {v:'PETS',      ex:['CAT','DOG','HAMSTER','PARROT']},
 {v:'FARM',      ex:['COW','PIG','SHEEP','GOAT']},
 {v:'HOME',      ex:['DOOR','WINDOW','BED','LAMP']},
 {v:'FRUITS',    ex:['APPLE','BANANA','ORANGE','PEAR']},
 {v:'TRANSPORT', ex:['BUS','TRAIN','CAR','SHIP']},
 {v:'SKY',       ex:['CLOUD','RAINBOW','STORM','RAIN']},
 {v:'HOLIDAYS',  ex:['EASTER','BIRTHDAY','CHRISTMAS','HALLOWEEN']},
 {v:'JOBS',      ex:['CHEF','DOCTOR','WAITER','ENGINEER']},
 {v:'MAGIC',     ex:['WAND','POTION','SPELL','CAULDRON']},
];
let TARGETS=DEFAULT_TARGETS;
let START_COUNTS=[4,3,3,3,2,2,2]; /* сколько слов первых категорий лежит на поле */
let FULL={}, MOVES_START=48, CATS_TOTAL=0, FIELD_TARGET=19, NO_LIMIT=false;
let METAW=new Set(); /* мета-слова уровня: не спавнятся, приходят превращением четвёрки */
function applyContent(){ FULL={}; TARGETS.forEach(t=>FULL[t.v]=t.ex.length); CATS_TOTAL=TARGETS.length; }
applyContent();

/* ===== уровень из JSON (?level=путь-к-файлу) — схема в levels/SCHEMA.md =====
   имена категорий скрыты до сборки (как в референсе): пузыри показывают слова,
   имя категории появляется только на финальном оранжевом пузыре. */
function applyLevel(L){
  TARGETS=L.categories.map(c=>({v:c.name.toUpperCase(),ex:c.words.map(w=>w.toUpperCase())}));
  const M=TARGETS.length,total=M*4;
  /* ЦЕПОЧКИ (правило референса): слово = имя другой категории уровня -> мета-слово.
     Оно не спавнится: игрок собирает ту категорию, и четвёрка ПРЕВРАЩАЕТСЯ
     в этот шар-слово родителя. */
  const byName={}; TARGETS.forEach((t,ti)=>byName[t.v]=ti);
  TARGETS.forEach(p=>{ p.meta=p.meta||null; });
  TARGETS.forEach(p=>p.ex.forEach(w=>{
    const ci=byName[w];
    if(ci!==undefined&&TARGETS[ci]!==p) TARGETS[ci].meta={parent:p.v,word:w};
  }));
  METAW=new Set(TARGETS.filter(t=>t.meta).map(t=>t.meta.word));
  NO_LIMIT=(L.board.move_limit==null);
  MOVES_START=NO_LIMIT?total*3:L.board.move_limit;
  FIELD_TARGET=Math.min(L.board.start_bubbles||19,total);
  /* старт: первой полную четвёрку получает категория без мета-слов,
     остальным раздаём почти поровну (не выше числа спавнящихся слов) */
  const spawnable=TARGETS.map(t=>t.ex.filter(w=>!METAW.has(w)).length);
  const order=[...TARGETS.keys()];
  const ff=spawnable.findIndex(n=>n===4);
  if(ff>0){order.splice(ff,1);order.unshift(ff);}
  START_COUNTS=new Array(M).fill(0);
  if(ff>=0) START_COUNTS[order[0]]=4;
  let left=FIELD_TARGET-(ff>=0?4:0), i=(ff>=0?1:0);
  let guard=10*M;
  while(left>0&&guard-->0){
    const ci=order[i%M];
    if(START_COUNTS[ci]<Math.min(4,spawnable[ci])){START_COUNTS[ci]++;left--;}
    i++;
  }
  applyContent();
  document.getElementById('lvl').textContent='LVL '+(L.level_id||1);
}
const W=390,H=600;
const PRAISE=['Cool!','Great!','Splendid!','Awesome!','Nice!'];

const board=document.getElementById('board');
const chainEl=document.getElementById('chain');
const ghostEl=document.getElementById('ghost');

/* ===== модификаторы: ?mod=halves|ice|hidden|chain (GDD §7) ==================
   Один модификатор на партию, уровень пересобирается с ним: половинки добавляют
   склейки в лимит ходов, лёд и «?» дают по ходу форы, цепь делит поле.
   Выбираются селектором на странице отчёта, рядом с выбором уровня. */
const MOD=new URLSearchParams(location.search).get('mod')||'none';
/* пузырь в руке: поле замирает целиком, чтобы структура не пересобиралась
   и освободившееся место не занималось досыпкой до финального решения */
let held=false;
let chainY=null,chainNeed=0,chainDown=true,halfPairs=0,fieldNow=19,MOVES_MAX=48;

let bubbles=[],queue=[],moves=0,done=0,over=false,praiseI=0,pendingPops=0;
let boosts={plus:2,hint:2,mag:2};
let uid=0;

function rFor(n){return Math.min(38+(n-1)*12,72);}

function makeBubble(val,ex,x,y,opt){
  const o=opt||{};
  const b={id:uid++,val,exs:[ex],x,y,px:x,py:y-1.2,r:rFor(1),
           half:o.half||null,ice:0,hid:0,zone:0,
           dragging:false,popping:false,el:document.createElement('div')};
  b.el.className='bub t1';
  b.el.addEventListener('pointerdown',e=>grab(e,b));
  board.appendChild(b.el);
  paint(b); place(b);
  bubbles.push(b);
  return b;
}
function paint(b){
  const n=b.exs.length;
  b.r=b.half?32:rFor(n);
  let cls='bub t'+Math.min(n,4);
  if(b.half) cls+=' half';
  if(b.ice>0) cls+=' ice';
  if(b.hid>0) cls+=' hid';
  if(b.el.classList.contains('hintGlow')) cls+=' hintGlow';
  b.el.className=cls;
  let html;
  if(b.hid>0){
    html='<div class="ln" style="font-size:26px">?</div>';           /* слово закрыто */
  }else if(b.half){
    /* половинка: точка показывает, с какой стороны прирастает вторая часть */
    const t=b.half.side===0?b.exs[0]+'\u00b7':'\u00b7'+b.exs[0];
    const fs=Math.min(14,Math.floor((b.r*2-12)/(0.62*t.length)));
    html='<div class="ln" style="font-size:'+fs+'px">'+t+'</div>';
  }else if(n>=(FULL[b.val]||4)){
    /* полная категория = оранжевый пузырь с ИМЕНЕМ категории (до этого имя скрыто) */
    const fs=Math.min(17,Math.floor((b.r*2-16)/(0.62*b.val.length)));
    html='<div class="ln" style="font-size:'+fs+'px">'+b.val+'</div>';
  }else{
    /* одиночка = слово; склеенный шар = ВСЕ собранные слова стопкой (как в референсе) */
    const maxLen=Math.max(...b.exs.map(e=>e.length));
    const base=n===1?15:14;
    const fs=Math.min(base,Math.floor((b.r*2-14)/(0.62*maxLen)),Math.floor((b.r*2-18)/(1.3*n)));
    html=b.exs.map(e=>'<div class="ln" style="font-size:'+fs+'px">'+e+'</div>').join('');
  }
  if(b.ice>0) html+='<div class="cnt">\u2744 '+b.ice+'</div>';
  else if(b.hid>0) html+='<div class="cnt">'+b.hid+'</div>';
  b.el.innerHTML=html;
  b.el.style.width=b.el.style.height=b.r*2+'px';
}
function place(b){
  b.el.style.left=(b.x-b.r)+'px';
  b.el.style.top=(b.y-b.r)+'px';
}

/* ===== модификаторы: подготовка уровня =====================================
   Половинки — акцент, а не фон: немного слов, только часть категорий, не больше
   одного распила в категории. Фрагмент не имеет права быть словом уровня, иначе
   игрок честно потащит половинку в категорию как слово. Полного словаря
   у прототипа нет, поэтому распил вида SHR|IMP такая проверка не поймает —
   ограничение известное. */
function splitHalves(list){
  const words=new Set(); TARGETS.forEach(t=>t.ex.forEach(w=>words.add(w)));
  const usedCats=new Set(); let pairs=0,pid=0;
  for(let i=0;i<list.length&&pairs<3;i++){
    const it=list[i];
    if(it.half||usedCats.has(it.v)) continue;
    const w=it.e;
    if(w.length<6||!/^[A-Za-zА-Яа-яЁё]+$/.test(w)) continue;
    const mid=Math.floor(w.length/2);
    let parts=null;
    for(const at of [mid,mid-1,mid+1]){
      if(at<2||w.length-at<2) continue;
      const a=w.slice(0,at),b=w.slice(at);
      if(words.has(a)||words.has(b)) continue;
      parts=[a,b]; break;
    }
    if(!parts) continue;
    words.add(parts[0]); words.add(parts[1]);
    usedCats.add(it.v); pid++;
    list.splice(i,1,{v:it.v,e:parts[0],half:{pair:pid,whole:w,side:0}},
                    {v:it.v,e:parts[1],half:{pair:pid,whole:w,side:1}});
    i++; pairs++;
  }
  return pairs;
}
/* Лёд и «?»: по одному пузырю на категорию, максимум два на уровень, счётчик 2-3.
   Снимаются успешными мерджами на поле — ошибка слой не снимает. */
function setBlockers(kind){
  const usedCats=new Set(); let n=0;
  for(const b of bubbles){
    if(n>=2) break;
    if(b.half||usedCats.has(b.val)) continue;
    usedCats.add(b.val);
    if(kind==='ice') b.ice=2+n; else b.hid=2+n;
    paint(b); n++;
  }
  return n;
}
/* Цепь: линия ставится так, чтобы под ней осталась примерно треть кучи — цепь
   отделяет именно нижнюю часть шаров. Мердж через неё запрещён, и она же
   физическая преграда: свою зону пузыри не покидают, пока цепь висит.
   Снимается сбором категорий, счётчик показан на самой цепи. */
function setChain(){
  const ys=bubbles.map(b=>b.y).sort((a,b)=>a-b);
  if(ys.length<4) return;
  const cut=Math.max(1,Math.floor(ys.length*0.66));
  chainY=Math.round((ys[cut-1]+ys[cut])/2);
  chainNeed=2; chainDown=false;
  bubbles.forEach(b=>{ b.zone=b.y>chainY?1:0; });
  chainEl.hidden=false; chainEl.style.opacity='1'; chainEl.style.top=chainY+'px';
}
function updChain(){
  if(chainY==null) return;
  chainEl.querySelector('.cn').textContent=chainDown
    ? 'цепь снята' : Math.min(done,chainNeed)+'/'+chainNeed+' категорий';
}
function breakChain(msg){
  if(chainDown) return;
  chainDown=true;
  chainEl.style.opacity='0';
  setTimeout(()=>{ if(chainDown) chainEl.hidden=true; },400);
  updChain();
  toastText(msg||'ЦЕПЬ ЛОПНУЛА',true);
}
/* Страховка от запертой раскладки: лёд тает только от мерджей, цепь снимается
   только сбором категорий. Если легального мерджа не осталось и досыпки уже
   не будет, препятствие снимается само — молча показывать неразрешимое поле
   хуже, чем признать ограничение вслух. */
function legalMove(){
  const act=bubbles.filter(b=>!b.popping&&b.ice<=0&&b.hid<=0);
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],c=act[j];
    if(!chainDown&&a.zone!==c.zone) continue;
    if(a.half||c.half){
      if(a.half&&c.half&&a.half.pair===c.half.pair&&a.half.side!==c.half.side) return true;
      continue;
    }
    if(a.val===c.val&&a.exs.length+c.exs.length<=(FULL[a.val]||4)) return true;
  }
  return false;
}
function rescueIfStuck(){
  if(over||pendingPops>0) return;
  if(queue.length&&bubbles.length<fieldNow) return;      /* досыпка ещё придёт */
  if(legalMove()) return;
  if(!chainDown){ breakChain('ЦЕПЬ СНЯТА: ХОДА НЕ БЫЛО'); return; }
  const blocked=bubbles.filter(b=>b.ice>0||b.hid>0);
  if(blocked.length){
    blocked.forEach(b=>{ b.ice=0; b.hid=0; paint(b); place(b); });
    toastText('ЛЁД РАСТАЯЛ САМ',true);
  }
}

/* ===== инициализация уровня ===== */
function init(){
  bubbles.forEach(b=>b.el.remove()); bubbles=[];
  board.querySelectorAll('.part,.conf').forEach(e=>e.remove());
  done=0; over=false; pendingPops=0; held=false; drag=null; clearMarks();
  chainY=null; chainNeed=0; chainDown=true; halfPairs=0;
  chainEl.hidden=true; chainEl.classList.remove('hit');
  boosts={plus:2,hint:2,mag:2};
  const start=[]; queue=[];
  TARGETS.forEach((t,ti)=>{
    const ex=t.ex.filter(e=>!METAW.has(e)); /* мета-слова не кладём ни на поле, ни в очередь */
    for(let i=ex.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ex[i],ex[j]]=[ex[j],ex[i]];}
    const k=ti<START_COUNTS.length?START_COUNTS[ti]:0;
    ex.forEach((e,i)=>(i<k?start:queue).push({v:t.v,e}));
  });
  for(let i=start.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[start[i],start[j]]=[start[j],start[i]];}
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  if(MOD==='halves') halfPairs=splitHalves(start);
  fieldNow=FIELD_TARGET+halfPairs;
  start.forEach((it,i)=>
    makeBubble(it.v,it.e, 46+Math.random()*(W-92), H-66-Math.floor(i/5)*80-Math.random()*30,
               it.half?{half:it.half}:null));
  for(let k=0;k<400;k++) physStep(1/60,true);
  /* запас ходов: склейка половинок тратит ход (слагаемое chunks в формуле лимита),
     блокирующий модификатор получает один ход форы */
  let bonus=halfPairs;
  if(MOD==='ice'&&setBlockers('ice')) bonus+=1;
  if(MOD==='hidden'&&setBlockers('hid')) bonus+=1;
  if(MOD==='chain'){ setChain(); bonus+=1; for(let k=0;k<400;k++) physStep(1/60,true); }
  MOVES_MAX=MOVES_START+bonus; moves=MOVES_MAX;
  bubbles.forEach(place);
  updHud(); updBoosts(); updChain();
  document.getElementById('ov').classList.remove('show');
}

/* ===== HUD ===== */
function updHud(){
  document.getElementById('movesNum').textContent=NO_LIMIT?'∞':moves;
  document.getElementById('ring').style.strokeDashoffset=NO_LIMIT?0:219.9*(1-Math.max(0,moves)/MOVES_MAX);
  document.getElementById('pillTxt').textContent=done+'/'+CATS_TOTAL;
  document.getElementById('pillFill').style.width=(done/CATS_TOTAL*100)+'%';
}
function updBoosts(){
  [['nPlus','bPlus','plus'],['nHint','bHint','hint'],['nMag','bMag','mag']].forEach(([n,btn,k])=>{
    document.getElementById(n).textContent=boosts[k];
    document.getElementById(btn).classList.toggle('off',boosts[k]<=0);
  });
}

/* ===== физика (Verlet: упор гасит скорость сам, куча лежит спокойно) ===== */
function physStep(dt,settle){
  if(held) return;   /* шар в руке: куча не шевелится, его место остаётся пустым */
  const g=0.4, damp=0.9; /* терминальная скорость ~240px/с — новый набор долетает за ~2с */
  for(const b of bubbles){
    if(b.dragging||b.popping) continue;
    b.fx=b.x; b.fy=b.y;
    b.wasSup=b.supported; b.supported=false;
    let vx=(b.x-b.px)*damp, vy=(b.y-b.py)*damp;
    if(Math.abs(vx)<0.04) vx=0;
    if(Math.abs(vy)<0.04) vy=0;
    /* лежащий на опоре неподвижный пузырь гравитация не дёргает,
       иначе куча вечно микро-проседает и дрожит */
    if(!(b.wasSup&&vx===0&&vy===0)) vy+=g;
    b.px=b.x; b.py=b.y; b.x+=vx; b.y+=vy;
  }
  for(let it=0;it<4;it++){
    for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){
      const a=bubbles[i],c=bubbles[j];
      if(a.popping||c.popping||a.dragging||c.dragging) continue; /* поднятый пузырь парит над полем */
      let dx=c.x-a.x, dy=c.y-a.y, d=Math.hypot(dx,dy)||0.01, min=(a.r+c.r)*0.96;
      if(d<min){
        if(dy>0.5*d) a.supported=true;      /* сосед снизу — опора */
        else if(dy<-0.5*d) c.supported=true;
        /* мягкое расталкивание: четверть перекрытия на пузырь за итерацию.
           Резкий толчок всего перекрытия сразу выглядел прыжком,
           а мёртвая зона в полпикселя оставляла постоянное наслоение */
        const push=(min-d)*0.25, nx=dx/d, ny=dy/d;
        a.x-=nx*push; a.y-=ny*push;
        c.x+=nx*push; c.y+=ny*push;
      }
    }
    for(const b of bubbles){
      if(b.dragging||b.popping) continue;
      if(b.x<b.r) b.x=b.r;
      if(b.x>W-b.r) b.x=W-b.r;
      if(b.y>H-b.r-4){b.y=H-b.r-4;b.supported=true;}
      if(b.y<-90) b.y=-90;
      /* цепь — физическая преграда: верхние лежат на ней, нижние заперты под ней */
      if(!chainDown&&chainY!=null){
        if(b.zone===0&&b.y>chainY-b.r-4){b.y=chainY-b.r-4;b.supported=true;}
        if(b.zone===1&&b.y<chainY+b.r+4){b.y=chainY+b.r+4;}
      }
    }
  }
  /* трение покоя: опора снизу и почти нет движения → гасим только СКОРОСТЬ.
     Позицию не откатываем: откат отменял расталкивание и консервировал наслоения. */
  for(const b of bubbles){
    if(b.dragging||b.popping) continue;
    if(b.supported&&Math.hypot(b.x-b.fx,b.y-b.fy)<0.35){ b.px=b.x; b.py=b.y; }
  }
  if(!settle) bubbles.forEach(place);
}
function still(b){ b.px=b.x; b.py=b.y; } /* обнулить скорость после ручного перемещения */

/* ===== постоянная досыпка: поле держит FIELD_TARGET пузырей, слова случайные ===== */
let lastSpawn=0;
function trySpawn(ts){
  if(over||held||!queue.length||bubbles.length>=fieldNow) return;
  if(ts-lastSpawn<420) return;
  lastSpawn=ts;
  const it=queue.shift();
  makeBubble(it.v,it.e, 56+Math.random()*(W-112), -44);
}

/* ===== драг: путь подсветкой, точка остановки, возврат при ошибке ===== */
let drag=null,hover=null;
const passed=new Set();
function boardXY(e){
  const r=board.getBoundingClientRect();
  return [(e.clientX-r.left)/boardScale,(e.clientY-r.top)/boardScale];
}
function clearMarks(){
  if(hover){ hover.el.classList.remove('tgt'); hover=null; }
  passed.forEach(c=>c.el.classList.remove('pass')); passed.clear();
  ghostEl.style.display='none';
}
function pickTarget(b){
  let best=null,bd=1e9;
  for(const c of bubbles){
    if(c===b||c.popping) continue;
    const d=Math.hypot(c.x-b.x,c.y-b.y);
    if(d<(c.r+b.r)&&d<bd){bd=d;best=c;}
  }
  return best;
}
/* Можно ли слить. Причина отказа определяет подсветку: слова не связаны —
   красный (ошибка игрока), лёд и «?» — морозный (препятствие), цепь — красный
   на цели и на самой цепи, чтобы было видно, что помешала именно она. */
function canMerge(b,t){
  if(t.ice>0) return {ok:false,why:'ice'};
  if(t.hid>0) return {ok:false,why:'hid'};
  if(!chainDown&&b.zone!==t.zone) return {ok:false,why:'chain'};
  if(b.half||t.half){
    const pair=b.half&&t.half&&b.half.pair===t.half.pair&&b.half.side!==t.half.side;
    return pair?{ok:true}:{ok:false,why:'wrong'};
  }
  if(b.val!==t.val) return {ok:false,why:'wrong'};
  if(b.exs.length+t.exs.length>(FULL[b.val]||4)) return {ok:false,why:'wrong'};
  return {ok:true};
}
function flash(el,cls){ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),360); }
function grab(e,b){
  if(over||b.popping||drag) return;
  if(b.ice>0||b.hid>0){ flash(b.el,'blk'); return; }   /* заморожен или закрыт: не тащится */
  e.preventDefault();
  const [x,y]=boardXY(e);
  drag={b,ox:b.x-x,oy:b.y-y,sx:b.x,sy:b.y};
  b.dragging=true; still(b);
  b.el.classList.add('lift');
  held=true;                     /* поле замирает до финального решения */
  ghostEl.style.width=ghostEl.style.height=(b.r*2)+'px';
  ghostEl.style.left=(b.x-b.r)+'px'; ghostEl.style.top=(b.y-b.r)+'px';
  ghostEl.style.display='block';
  /* захват: без него драг рвётся, когда курсор уходит с пузыря */
  try{ b.el.setPointerCapture&&b.el.setPointerCapture(e.pointerId); }catch(_){}
}
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  const b=drag.b;
  const [x,y]=boardXY(e);
  b.x=Math.max(b.r,Math.min(W-b.r,x+drag.ox));
  b.y=Math.max(b.r,Math.min(H-b.r,y+drag.oy));
  place(b);
  /* след: всё, над чем пронесли шар, остаётся подсвеченным до конца жеста */
  for(const c of bubbles){
    if(c===b||c.popping||passed.has(c)) continue;
    if(Math.hypot(c.x-b.x,c.y-b.y)<(c.r+b.r)){ passed.add(c); c.el.classList.add('pass'); }
  }
  const t=pickTarget(b);
  if(t!==hover){
    if(hover) hover.el.classList.remove('tgt');
    hover=t;
    if(hover) hover.el.classList.add('tgt');
  }
});
window.addEventListener('pointerup',()=>{
  if(!drag) return;
  const b=drag.b, start={x:drag.sx,y:drag.sy}, t=hover;
  clearMarks();
  b.dragging=false; still(b); b.el.classList.remove('lift');
  drag=null; held=false;
  if(over||!t) return;              /* отпустили в пустоту — шар просто падает в кучу */
  const v=canMerge(b,t);
  if(v.ok){ merge(t,b,true); return; }
  /* неверное действие: цель подсвечивается красным, шар возвращается на своё
     место, ход не тратится, структура поля вообще не менялась */
  if(v.why==='chain') flash(chainEl,'hit');
  flash(t.el, v.why==='ice'||v.why==='hid' ? 'blk' : 'err');
  flyBack(b,start);
});
function flyBack(b,to){
  b.popping=true;
  b.el.style.transition='left .28s,top .28s';
  b.x=to.x;b.y=to.y;place(b);
  setTimeout(()=>{b.el.style.transition='';b.popping=false;still(b);},290);
}

/* ===== склейка ===== */
function merge(a,b,costMove){
  if(a.half&&b.half){
    /* две части одного слова дают обычный пузырь-слово (GDD §7): счётчик слов
       категории от склейки половинок не растёт, зато тратится ход */
    a.half=null; a.exs=[b.half.whole];
  }else{
    a.exs=a.exs.concat(b.exs);
  }
  bubbles=bubbles.filter(x=>x!==b); b.el.remove();
  paint(a); place(a);
  a.el.classList.remove('merged'); void a.el.offsetWidth; a.el.classList.add('merged');
  if(costMove){ moves--; updHud(); }
  /* успешный мердж снимает слой льда и приближает раскрытие «?» на всём поле */
  bubbles.forEach(x=>{
    if(x.ice>0){ x.ice--; paint(x); place(x); }
    else if(x.hid>0){ x.hid--; paint(x); place(x); }
  });
  if(a.exs.length>=FULL[a.val]){
    pendingPops++;
    a.popping=true;
    setTimeout(()=>popGroup(a),380);
  }else{
    rescueIfStuck();
  }
  checkEnd();
}
function popGroup(a){
  const cd=TARGETS.find(t=>t.v===a.val);
  if(cd&&cd.meta){ metaTransform(a,cd.meta); return; }
  a.el.classList.add('popping');
  particles(a.x,a.y,a.r);
  toast();
  setTimeout(()=>{
    bubbles=bubbles.filter(x=>x!==a); a.el.remove();
    done++; pendingPops--;
    updHud(); afterCategory();
    checkEnd();
  },300);
}
/* цепочка: собранная четвёрка не улетает, а ПРЕВРАЩАЕТСЯ в шар-слово родителя */
function metaTransform(a,meta){
  particles(a.x,a.y,a.r);
  toast();
  a.val=meta.parent; a.exs=[meta.word];
  paint(a); place(a); still(a);
  a.el.classList.remove('merged'); void a.el.offsetWidth; a.el.classList.add('merged');
  a.popping=false;
  done++; pendingPops--;
  updHud(); afterCategory();
  checkEnd();
}
/* собранная категория двигает счётчик цепи */
function afterCategory(){
  updChain();
  if(!chainDown&&done>=chainNeed) breakChain();
  rescueIfStuck();
}
function particles(x,y,r){
  for(let i=0;i<9;i++){
    const p=document.createElement('div');p.className='part';
    p.style.left=(x-5)+'px';p.style.top=(y-5)+'px';
    board.appendChild(p);
    const a=Math.PI*2*i/9, d=r+22+Math.random()*26;
    requestAnimationFrame(()=>{
      p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),750);
  }
}
function toast(){ toastText(PRAISE[praiseI++%PRAISE.length]); }
function toastText(msg,small){
  const t=document.getElementById('toast');
  t.style.fontSize=small?'22px':'';
  t.textContent=msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}

/* ===== победа / поражение ===== */
function checkEnd(){
  if(over) return;
  if(done>=CATS_TOTAL){
    over=true;
    setTimeout(()=>{confetti();showCard('Уровень пройден! 🎉','Все '+CATS_TOTAL+' наборов собраны. Осталось ходов: '+moves);},1000);
    return;
  }
  if(moves<=0&&pendingPops===0&&done<CATS_TOTAL){
    const canWin=done+pendingPops>=CATS_TOTAL;
    if(!canWin){ over=true; showCard('Ходы кончились 😢','Собрано '+done+' из '+CATS_TOTAL+' наборов.'); }
  }
}
function showCard(ttl,msg){
  document.getElementById('cardTtl').textContent=ttl;
  document.getElementById('cardMsg').textContent=msg;
  document.getElementById('ov').classList.add('show');
}
function confetti(){
  const cols=['#ff5d8f','#ffd94a','#4fc463','#4fa8ff','#c07aff'];
  for(let i=0;i<22;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.background=cols[i%cols.length];
    c.style.left=(W/2-4)+'px';c.style.top=(H*0.3)+'px';
    c.style.transform='rotate('+(i*37)+'deg)';
    board.appendChild(c);
    const a=Math.PI*2*i/22, d=90+Math.random()*130;
    requestAnimationFrame(()=>{
      c.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+120}px) rotate(${300+i*40}deg)`;
      c.style.opacity='0';
    });
    setTimeout(()=>c.remove(),1200);
  }
}

/* ===== бустеры ===== */
document.getElementById('bPlus').addEventListener('click',()=>{
  if(over||boosts.plus<=0) return;
  boosts.plus--; moves+=5; updHud(); updBoosts();
});
document.getElementById('bHint').addEventListener('click',()=>{
  if(over||boosts.hint<=0) return;
  const cnt={};
  bubbles.forEach(b=>{if(!b.popping&&!b.half&&b.ice<=0&&b.hid<=0)cnt[b.val]=(cnt[b.val]||0)+1;});
  let best=null;
  for(const v in cnt) if(cnt[v]>=2&&(!best||cnt[v]>cnt[best])) best=v;
  if(!best) return;
  boosts.hint--; updBoosts();
  bubbles.filter(b=>b.val==best&&!b.half&&b.ice<=0&&b.hid<=0)
         .forEach(b=>b.el.classList.add('hintGlow'));
  setTimeout(()=>bubbles.forEach(b=>b.el.classList.remove('hintGlow')),4000);
});
document.getElementById('bMag').addEventListener('click',()=>{
  if(over||boosts.mag<=0) return;
  /* магнит подчиняется тем же правилам, что игрок: лёд, «?», цепь и половинки
     он не обходит, иначе бустер «решал» бы модификатор за игрока */
  const cand=bubbles.filter(b=>!b.popping&&!b.dragging&&b.ice<=0&&b.hid<=0);
  let pick=null;
  for(const a of cand) for(const m of cand){
    if(a===m||!canMerge(m,a).ok) continue;
    if(!pick||a.exs.length>pick[0].exs.length) pick=[a,m];
  }
  if(!pick) return;
  boosts.mag--; updBoosts();
  const [anchor,mover]=pick;
  mover.popping=true;
  mover.el.style.transition='left .38s ease-in,top .38s ease-in';
  mover.x=anchor.x; mover.y=anchor.y; place(mover);
  setTimeout(()=>{
    mover.el.style.transition=''; mover.popping=false; still(mover);
    if(bubbles.includes(anchor)&&bubbles.includes(mover)&&!anchor.popping) merge(anchor,mover,false);
  },400);
});
document.getElementById('gear').addEventListener('click',init);
document.getElementById('cardBtn').addEventListener('click',init);

/* ===== главный цикл (физика фикс-шагом 1/60с, независимо от FPS) ===== */
let prev=0;
function loop(ts){
  const dt=(ts-prev)/1000; prev=ts;
  if(!over){
    const steps=Math.max(1,Math.min(10,Math.round(dt*60)));
    for(let i=0;i<steps;i++) physStep(1/60,false);
    trySpawn(ts);
  }
  requestAnimationFrame(loop);
}
/* ===== старт: уровень из ?level=... (JSON) либо встроенный контент ===== */
(async function boot(){
  const q=new URLSearchParams(location.search).get('level');
  if(q){
    try{ applyLevel(await (await fetch(q)).json()); console.log('level loaded:',q); }
    catch(e){ console.warn('level load failed, играем встроенный контент:',e); }
  }
  init();
  requestAnimationFrame(fit);
  requestAnimationFrame(loop);
})();
</script>
