# Через сколько уровней можно повторить один и тот же элемент.
#
# Формат намеренно плоский: `ключ: число` и комментарии. Парсер строгий —
# любая вложенность или лишний синтаксис роняют команду, а не читаются
# наполовину. Значения — это стартовые ориентиры, а не закон: их положено
# двигать по итогам приёмки уровней.
#
# Ноль означает «повтор разрешён всегда».

# Одно и то же слово в одном и том же значении.
same_word_sense: 20

# Одна и та же игровая формулировка категории (variant).
same_category_variant: 60

# Один и тот же семантический принцип (concept): BIRDS OF PREY и RAPTORS
# считаются одним элементом, даже если формулировки разные.
same_category_concept: 40

# Ровно та же четвёрка слов.
same_quartet: 120

# Запреты внутри одного уровня. 1 = нарушение запрещено, 0 = разрешено.
forbid_duplicate_display_in_level: 1
forbid_duplicate_category_label_in_level: 1
forbid_conflicting_categories_in_level: 1
