# Профили генерации: чем управляем, собирая уровень.
#
# Формат плоский: `профиль.параметр: число`. Ключ без префикса задаёт значение
# для всех профилей сразу. Парсер строгий — неизвестный параметр роняет команду.
#
# Пороги здесь стартовые, а не окончательные. Их положено двигать по итогам
# приёмки уровней: профиль — это гипотеза о том, какой уровень получится,
# и проверяется она на реальных уровнях, а не в конфиге.
#
# Первая калибровка уже сделана по фактическому распределению базы. Исходный
# ambiguity_budget 0.35 для лёгкого профиля пропускал 16 четвёрок из 3197:
# в живой базе почти каждое слово встречается больше чем в одной категории,
# и средняя ambiguity_pressure равна 0.68. Порог 0.35 отсекал не спорные
# четвёрки, а базу целиком. Сейчас лёгкий профиль даёт около 190 категорий —
# этого хватает на уровни без немедленных повторов.
#
# Главное, ради чего профили существуют: генератор не должен просто брать
# четыре самых частотных слова. Так получаются понятные и совершенно скучные
# уровни. Понятность и интересность — две разные оси, и обе задаются здесь.

# ------------------------------------------------------------------ общее для всех
# Уровень, который база отдаёт игроку, обязан знать, каким значением стоит в нём
# каждое слово. Это не строгость первой линейки, а инвариант базы: связь без
# разрешённого значения — не «безопасная», а неописанная, и проверка приёмки
# `level_slots_resolved` роняет сборку, если такая связь доехала до уровня.
#
# Порог не требует, чтобы значение было главным: `hard_knowledge` по-прежнему
# берёт нишевые значения, но теперь знает, какие именно.
require_resolved_senses: 1

# ------------------------------------------------------------------ easy_accessible
# Первые уровни кампании: всё знакомо, ничего не мешает разобраться в механике.
easy_accessible.word_familiarity_min: 0.50
easy_accessible.word_familiarity_avg_min: 0.64
easy_accessible.word_accessibility_min: 0.60
easy_accessible.max_word_chars: 12
easy_accessible.max_word_tokens: 2
easy_accessible.max_label_chars: 20
easy_accessible.max_label_tokens: 4
easy_accessible.label_quality_min: 0.62
easy_accessible.quartet_quality_min: 0.60
easy_accessible.quartet_interest_target: 0.35
easy_accessible.ambiguity_budget: 0.80
easy_accessible.rare_word_budget: 0
easy_accessible.long_phrase_budget: 0
easy_accessible.novel_words_target_ratio: 0.05

# ------------------------------------------------------------------ accessible_fun
# Основная масса уровней: понятно, но есть за что зацепиться.
accessible_fun.word_familiarity_min: 0.40
accessible_fun.word_familiarity_avg_min: 0.58
accessible_fun.word_accessibility_min: 0.50
accessible_fun.max_word_chars: 16
accessible_fun.max_word_tokens: 3
accessible_fun.max_label_chars: 26
accessible_fun.max_label_tokens: 5
accessible_fun.label_quality_min: 0.58
accessible_fun.quartet_quality_min: 0.55
accessible_fun.quartet_interest_target: 0.55
accessible_fun.ambiguity_budget: 0.90
accessible_fun.rare_word_budget: 2
accessible_fun.long_phrase_budget: 2
accessible_fun.novel_words_target_ratio: 0.20

# ------------------------------------------------------------------ first_lineup
# Вход в игру: двадцать уровней, на которых игрок решает, останется ли он.
# Профиль строже всех остальных, и строгость взята не с потолка — каждый порог
# закрывает измеренную потерю фана на ремейке двадцатки
# (`levels/eval/reference-vs-remake.md`):
#
#   max_word_tokens: 1     90 нечитаемых пузырей из 768 против 11 в записи.
#                          «harbor seal» и «answering phones» — не слово в пузыре.
#   forbid_vague_label: 1  33 надписи-признака из 192 против 1 из 188. −1.45 фана.
#   знакомость выше easy   средняя знакомость ремейка 0.538 против 0.594 в записи;
#                          сложность у нас набиралась редкими словами, а не игрой.
#
# Порог средней знакомости заметно ниже, чем у easy_accessible (0.52 против
# 0.64), и это не послабление, а замер. Мета-пара требует, чтобы надпись
# правила была обычным словом, и такие правила сидят в средней части базы:
#
#   порог средней знакомости   0.60   0.56   0.52   0.48
#   правил доступно             194    289    362    388
#   мета-пар доступно             3      7     16      21
#
# При 0.60 мета-механика в первой линейке умирает: три пары на двадцать
# уровней против 52 связей в записи. Знакомость при этом теряется мало —
# порог отсекает четвёрку по средней, а на уровне слов много, и фактическая
# знакомость собранных уровней выходит выше 0.63 при пороге 0.52.
first_lineup.word_familiarity_min: 0.43
first_lineup.word_familiarity_avg_min: 0.52
first_lineup.word_accessibility_min: 0.55
first_lineup.max_word_chars: 12
first_lineup.max_word_tokens: 1
first_lineup.max_label_chars: 22
first_lineup.max_label_tokens: 4
first_lineup.label_quality_min: 0.60
first_lineup.quartet_quality_min: 0.58
first_lineup.quartet_interest_target: 0.40
first_lineup.ambiguity_budget: 0.95
first_lineup.rare_word_budget: 0
first_lineup.long_phrase_budget: 0
# Имена собственные. Первая сборка двадцатки дала 236 из 768 пузырей против
# 81 из 752 в записи: три группы имён на одном поле (COMMON SURNAMES, SPANISH
# NAMES, SURNAMES FROM TRADES) и туториал из брендов магазинов. Формально
# слова частотные и однословные — все пороги качества они проходят. Доля
# записи 11%, потолок ниже держит её примерно там же.
first_lineup.max_proper_nouns: 2
first_lineup.proper_noun_budget: 6
# Вторые значения. Статус `alternative` означает «слово живёт здесь, но дома
# у него другой»; для поздней кампании это ценный материал, для входа в игру —
# подвох. Замер: 257 четвёрок пула из 1249 содержат такое слово, и одна из них
# дала на туториале CARD TRICKS = control / cut / force / pass. Одно второе
# значение в четвёрке допустимо, четыре — нет.
first_lineup.max_secondary_senses: 1
first_lineup.novel_words_target_ratio: 0.10
first_lineup.forbid_vague_label: 1

# ---- доступность значений -------------------------------------------------
# Порог выше (`max_secondary_senses`) меряет СТАТУС связи в базе: первое это
# значение слова или второе. Он не отличает `orange` в COLORS от `Trouble` в
# BOARD GAMES — обе связи `approved`, обе верны. Разница в другом: цвет
# `orange` знают все, игру `Trouble` почти никто, и увидев слово без надписи
# игрок вспоминает неприятность, а не игру.
#
# Замер, ради которого этот блок появился. Пакет TOP001..020 содержал
# BOARD GAMES = Life / risk / sorry / trouble: четыре частотных однословных
# пузыря, все пороги качества пройдены, играть невозможно. 694 лексических
# слота из 746 в том пакете вообще не знали, каким значением стоит слово.

# Каждое лексическое слово обязано знать своё значение. Неразрешённое значение
# больше не считается безопасным состоянием.
first_lineup.require_resolved_senses: 1

# Значения, известные узкому кругу, во входе в игру запрещены полностью.
# Не потому, что они неверны, — потому что игрок про них не вспомнит.
first_lineup.max_specialist_senses_per_group: 0
first_lineup.max_obscure_senses_per_group: 0
# Вторые, но массово известные значения — честная ловушка, и одна на группу
# делает уровень интереснее. Две превращают группу в угадайку.
first_lineup.max_common_secondary_senses_per_group: 1

# Три слова из четырёх должны быть ясными якорями: тему видно, а не вычисляют
# исключением. Ровно этого не хватало группе Life / risk / sorry / trouble —
# у неё якорей ноль. Мета-коллекторы и правила про написание из проверки
# исключены: лексических якорей у них нет по устройству.
first_lineup.min_clear_anchors_per_lexical_group: 3
# Порог якоря. Узнаваемость — узнает, если объяснить; активация — вспомнит
# сам, увидев слово без надписи. Для якоря нужно второе, поэтому порог
# активации отдельный и ниже: 0.60 пропускает `bark` как кору дерева (0.62)
# и не пропускает `cast` как гипс (0.55).
first_lineup.anchor_recognition_min: 0.75
first_lineup.anchor_activation_min: 0.60

# Бюджеты уровня. Одна ловушка на уровень — приём; ловушка в каждой группе —
# уровень, на котором игрок перестаёт доверять собственному чтению слов.
first_lineup.max_unresolved_senses_per_level: 0
first_lineup.max_specialist_senses_per_level: 0
first_lineup.max_common_secondary_senses_per_level: 2
first_lineup.max_anchorless_groups_per_level: 0

# Пакет целиком. Доля групп, у которых SWOW сумел измерить пары и не нашёл
# ни одной связи: 22% у записи оригинала против 52% у первой сборки нашей
# двадцатки. Порог держит нас на уровне записи.
#
# SWOW здесь не жёсткий фильтр отдельной четвёрки: нуль в датасете часто
# означает отсутствие наблюдения, а не отсутствие смысла, и одинаковый порог
# для ассоциативной группы и для сторон света выбросил бы структурные наборы.
first_lineup.max_anchorless_groups_per_pack: 0
first_lineup.max_swow_disconnected_group_ratio: 0.22
# Как порог пакета удерживается на практике: бюджет уровня. Число подобрано
# замером на собранной двадцатке, а не рассуждением:
#
#   бюджет на уровень      2     3     4
#   уровней собралось     11    19    20
#   мета-связей           13    20    25
#   несвязных групп     16.8% 17.8% 20.8%
#
# Жёсткий бюджет 2 выглядит строже и на деле хуже: генератор упирается в него
# на середине пакета, недобирает половину уровней и вместе с ними теряет
# мета-механику. Основную работу делает не потолок, а порядок — связные
# четвёрки предлагаются первыми, — поэтому фактические 20.8% лежат заметно
# ниже разрешённых 22% даже при бюджете 4.
first_lineup.max_swow_disconnected_groups_per_level: 4

# ------------------------------------------------------------------ hard_knowledge
# Поздняя кривая: знание предметной области, а не только сообразительность.
hard_knowledge.word_familiarity_min: 0.20
hard_knowledge.word_familiarity_avg_min: 0.42
hard_knowledge.word_accessibility_min: 0.35
hard_knowledge.max_word_chars: 22
hard_knowledge.max_word_tokens: 3
hard_knowledge.max_label_chars: 30
hard_knowledge.max_label_tokens: 6
hard_knowledge.label_quality_min: 0.58
hard_knowledge.quartet_quality_min: 0.45
hard_knowledge.quartet_interest_target: 0.60
hard_knowledge.ambiguity_budget: 0.85
hard_knowledge.rare_word_budget: 8
hard_knowledge.long_phrase_budget: 4
hard_knowledge.novel_words_target_ratio: 0.35
