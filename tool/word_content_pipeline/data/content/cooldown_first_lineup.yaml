# Перезарядка для первой линейки: двадцать уровней входа в игру.
#
# Формат и смысл ключей — как в `cooldown_config.yaml`; здесь только другие
# числа и причина, по которой они другие.
#
# Обычная кампания идёт сотнями уровней, и там повтор темы через двадцать
# уровней — это разнообразие. Первая линейка устроена иначе: игрок ещё не знает
# правил, и приоритет у неё не оригинальность, а узнаваемость. Самых бытовых
# тем в языке немного, самых ходовых слов тоже; запрет на возврат к ним ровно
# в тех двадцати уровнях, где они нужнее всего, работает против задачи.
#
# Так же устроен и оригинал. По записи: `orange` возвращается со второго уровня
# на первый же следующий в новой роли, `cookie` со второго на пятый, `hat` с
# третьего на четвёртый, `cold` с пятого на седьмой, `bed` встречается на L2,
# L4 и L6 в трёх разных группах. Тема напитков идёт подряд на L5 и L6. Это не
# небрежность автора, это память игрока как игровой материал: то же слово в
# новой роли — самая дешёвая и самая честная ловушка в жанре.
#
# Нулевыми интервалы всё-таки не сделаны: два одинаковых уровня подряд читаются
# не как замысел, а как баг сборки.

# Одно и то же слово в одном и том же значении. Три уровня — это «через один
# на третий», как `cookie` L2 -> L5 в записи.
same_word_sense: 3

# Одна и та же игровая формулировка категории.
same_category_variant: 4

# Один и тот же семантический принцип: BEVERAGES и DRINKS считаются одним.
# Три, потому что в записи питьевая тема идёт на L5 и снова на L6.
same_category_concept: 3

# Ровно та же четвёрка слов: вот это уже повтор уровня, а не темы.
same_quartet: 12

# Запреты внутри одного уровня не ослабляются ни на сколько: два одинаковых
# пузыря на одном поле — брак при любых настройках кампании.
forbid_duplicate_display_in_level: 1
forbid_duplicate_category_label_in_level: 1
forbid_conflicting_categories_in_level: 1
